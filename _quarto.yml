project:
  type: website
  output-dir: docs
  resources:
    # load-bearing files Quarto must re-emit into docs/ on every render, else a
    # full render strips them: CNAME (custom domain) and .nojekyll (so GitHub Pages
    # serves the underscore dir _data/, which the OJS charts fetch at runtime).
    - CNAME
    - ".nojekyll"
  render:
    - "*.qmd"
    - "resources/*.qmd"
    - "posts/*/index.qmd"
    - "citation-arcs/index.qmd"

website:
  title: "Aaron Erlich"
  # Load-bearing for dissemination: Quarto only emits og:/twitter: card tags and
  # only generates the blog RSS feed (docs/blog.xml, from `feed: true` in blog.qmd)
  # when site-url is set. Bluesky and LinkedIn build their link preview cards from
  # those tags, so removing this silently degrades every shared link to a bare URL.
  site-url: https://aaronerlich.com
  description: "Aaron Erlich — political science, post-Soviet politics, survey methodology."
  open-graph: true
  twitter-card: true
  # Disabled — the language toggle lives at top-right and overlaps the
  # default search box. Site has few enough pages that the navbar
  # suffices; search is cruft.
  search: false
  navbar:
    left:
      - text: "About"
        href: index.qmd
      - text: "Lab"
        href: lab.qmd
      - text: "C.V."
        href: cv.qmd
      # Two views of the same subject — the road to acceptance, then what
      # happens to citations afterwards. Grouped rather than moved: the page
      # URLs are baked into published social posts, and citation-arcs/index.qmd
      # includes its widget from posts/2026-08-citation-arcs/widget/app.R, so
      # relocating either file breaks the render outright.
      - text: "Publication Pipeline"
        menu:
          - text: "Publication Record"
            href: submissions.qmd
          - text: "Citation Arcs"
            href: citation-arcs/index.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Letter of Rec"
        href: resources/letters.qmd
      # - text: "Research"
      #   href: research.qmd
      # - text: "Resources"
      #   menu:
      #     - text: "Georgia Bibliography"
      #       href: resources/georgia-bib.qmd
      #     - text: "Undergraduate Thesis and Internships"
      #       href: resources/thesis-internships.qmd
      #     - text: "Political Science Writing"
      #       href: resources/writing.qmd
      # - text: "Teaching"
      #   menu:
      #     - text: "Teaching"
      #       href: teaching.qmd
      #     - text: "R Tutorials"
      #       href: r-tutorials.qmd

format:
  html:
    theme: cosmo
    css:
      - styles.css
      - https://cdn.jsdelivr.net/npm/academicons@1.9.2/css/academicons.min.css
    toc: false
    # GoatCounter analytics. No cookies and no personally identifying data, so no
    # consent banner is needed. Referrers are the point — the only way to tell
    # LinkedIn from Bluesky from direct. Dashboard: https://erlich-blog.goatcounter.com
    # A page only starts reporting once it has been re-rendered with this tag, and a
    # project-wide `quarto render` is destructive here (it clears docs/ and then dies
    # in the shinylive extension) — so re-render page by page.
    include-in-header:
      text: |
        <script data-goatcounter="https://erlich-blog.goatcounter.com/count"
                async src="//gc.zgo.at/count.js"></script>
    include-after-body: _generated/i18n-toggle.html
