- employer: National Democratic Institute of International Affairs (NDI)
  locations: Kenya, Nepal, Ukraine, Montenegro
  role: Consultant
  dates: 2010-2024
  bullets:
  - Provided strategic design and implementation consultancy for over one million dollars of applied political public opinion
    and focus group work. Wrote analytic reports.
- employer: National Democratic Institute of International Affairs (NDI)
  role: Senior Program Officer, Research and Data Analysis
  dates: '2010'
  bullets:
  - Ran NDI's USAID program to implement the first polling station level digitalized maps in Africa.
  - Initiated and oversaw NDI's Norwegian-funded qualitative and quantitative research program to investigate Kenyan citizens'
    attitudes towards the electoral process.
- employer: Caucasus Research Resource Centers (CRRC), Eurasia Foundation
  role: CRRC Deputy Director for Projects
  dates: 2006-2010
  bullets:
  - Directed and helped implement CRRC assessments and evaluations, including supervision of USAID funded migration assessment
    in Armenia and a multiyear assessment of Millennium Challenge Corporation's (MCC) efficacy in economic development in
    Georgia.
  - Coordinated CRRC Data Initiative (the largest cross-border survey in the Caucasus) and other survey and focus group activities,
    including questionnaire development, focus group guide development, questionnaire translation, expert meetings and report
    write-ups.
  - Ran a 600,000 dollar election-related research program in cooperation with NDI.
