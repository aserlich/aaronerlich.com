      Pour les candidats potentiels, ce tableau donne un bon aperçu des profils d'étudiants qui travaillent
      avec moi.
    es: Estos estudiantes trabajaron estrechamente conmigo. Las investigaciones y publicaciones enumeradas
      son únicamente aquellas completadas conmigo durante el período en que estuvieron afiliados al laboratorio.
      Para los estudiantes prospectivos, esta tabla ofrece una buena idea del tipo de estudiantes que
      trabajan conmigo.
    ru: Эти студенты тесно сотрудничали со мной. Перечисленные исследования и публикации — лишь те, что
      были выполнены совместно со мной в период их работы в лаборатории. Для потенциальных студентов данная
      таблица даёт наглядное представление о том, с какими исследователями я работаю.
    uk: Ці студенти тісно співпрацювали зі мною. Зазначені дослідження та публікації стосуються лише тих
      робіт, що були виконані спільно зі мною в період їхньої приналежності до лабораторії. Для майбутніх
      студентів ця таблиця дає уявлення про типовий профіль тих, хто працює зі мною.
    ka: ეს სტუდენტები მჭიდროდ თანამშრომლობდნენ ჩემთან. ჩამოთვლილი კვლევები და პუბლიკაციები მხოლოდ ის ნამუშევრებია,
      რომლებიც ლაბორატორიასთან აფილიაციის პერიოდში ჩემთანთ ერთად შეასრულეს. პოტენციური სტუდენტებისთვის
      ეს ცხრილი კარგ წარმოდგენას გაძლევთ იმ სტუდენტების ტიპებზე, ვინც ჩემთან მუშაობს.
    de: Diese Studierenden haben eng mit mir zusammengearbeitet. Die aufgeführten Forschungsarbeiten und
      Publikationen sind ausschließlich jene, die gemeinsam mit mir während ihrer Zeit im Labor entstanden
      sind. Für Studieninteressierte vermittelt diese Tabelle einen guten Eindruck von den Studierenden,
      die mit mir zusammenarbeiten.
