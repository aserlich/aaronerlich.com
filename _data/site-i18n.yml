lab:
  intro:
    en: Bringing together researchers interested in transparency, information provision, and participation
      (TIP), the DemoTIP laboratory applies state of the art research methods to bring answers to empirical
      problems in political science. Lab members test and challenge conventional theories regarding political
      transparency and accountability, the provision of political information, and citizen participation
      in democratic processes. Email if you are interested in getting involved!
    fr: Réunissant des chercheurs et chercheuses intéressés par la transparence, la fourniture d'information
      et la participation (TIP), le laboratoire DemoTIP applique des méthodes de recherche de pointe pour
      apporter des réponses à des problèmes empiriques en science politique. Les membres du laboratoire
      mettent à l'épreuve et remettent en question les théories conventionnelles relatives à la transparence
      et à la reddition de comptes politiques, à la fourniture d'information politique, ainsi qu'à la
      participation citoyenne dans les processus démocratiques. Écrivez-nous si vous souhaitez vous impliquer
      !
    es: El laboratorio DemoTIP reúne a investigadores interesados en transparencia, provisión de información
      y participación (TIP), y aplica métodos de investigación de vanguardia para dar respuesta a problemas
      empíricos en ciencia política. Los miembros del laboratorio ponen a prueba y cuestionan las teorías
      convencionales sobre la transparencia y la rendición de cuentas políticas, la provisión de información
      política y la participación ciudadana en los procesos democráticos. ¡Escríbanos si le interesa participar!
    ru: Объединяя исследователей, занимающихся вопросами прозрачности, предоставления информации и участия
      (TIP), лаборатория DemoTIP применяет передовые методы исследования для решения эмпирических проблем
      политической науки. Члены лаборатории проверяют и оспаривают устоявшиеся теории, касающиеся политической
      прозрачности и подотчётности, распространения политической информации и участия граждан в демократических
      процессах. Если вас интересует сотрудничество, напишите нам!
    uk: Об'єднуючи дослідників, зацікавлених у прозорості, наданні інформації та участі (TIP), лабораторія
      DemoTIP застосовує найсучасніші дослідницькі методи для пошуку відповідей на емпіричні питання політичної
      науки. Члени лабораторії перевіряють і переосмислюють загальноприйняті теорії щодо політичної прозорості
      та підзвітності, поширення політичної інформації та участі громадян у демократичних процесах. Якщо
      вас цікавить участь у нашій роботі — напишіть нам!
    ka: DemoTIP ლაბორატორია აერთიანებს მკვლევარებს, რომლებიც დაინტერესებულნი არიან გამჭვირვალობით, ინფორმაციის
      მიწოდებით და მონაწილეობით (TIP), და იყენებს უახლეს სამეცნიერო მეთოდებს პოლიტიკის მეცნიერებაში არსებული
      ემპირიული პრობლემების გადასაჭრელად. ლაბორატორიის წევრები ამოწმებენ და სადავოდ ხდიან კონვენციურ თეორიებს
      პოლიტიკური გამჭვირვალობისა და ანგარიშვალდებულების, პოლიტიკური ინფორმაციის მიწოდებისა და დემოკრატიულ
      პროცესებში მოქალაქეთა მონაწილეობის შესახებ. მოგვწერეთ ელ. ფოსტაზე, თუ გაინტერესებთ მონაწილეობა!
    de: Das DemoTIP-Labor vereint Forschende, die sich für Transparenz, Informationsbereitstellung und
      Partizipation (TIP) interessieren, und wendet modernste Forschungsmethoden an, um empirische Fragestellungen
      der Politikwissenschaft zu beantworten. Die Labormitglieder überprüfen und hinterfragen gängige
      Theorien zu politischer Transparenz und Rechenschaftspflicht, zur Bereitstellung politischer Informationen
      sowie zur Bürgerbeteiligung an demokratischen Prozessen. Bei Interesse an einer Mitwirkung bitte
      per E-Mail melden!
