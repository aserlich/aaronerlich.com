  aaron_bio:
    en: Aaron Erlich is Associate Professor of Political Science at McGill University. He received his
      Ph.D. from the University of Washington in 2016. His wide-ranging research interests touch upon
      various themes such as democracy, political participation, the effect of information, and the development
      and use of advanced quantitative methods. His research has been published in journals such as the
      American Political Science Review, Journal of Politics, Comparative Political Studies, and many
      others.
    fr: Aaron Erlich est Professeur agrégé de science politique à McGill University. Il a obtenu son doctorat
      de l'Université de Washington en 2016. Ses intérêts de recherche, qui couvrent un large spectre,
      portent sur diverses thématiques telles que la démocratie, la participation politique, l'effet de
      l'information, ainsi que le développement et l'utilisation de méthodes quantitatives avancées. Ses
      recherches ont été publiées dans des revues telles que l'American Political Science Review, le Journal
      of Politics, Comparative Political Studies, et bien d'autres.
    es: Aaron Erlich es Profesor Asociado de Ciencia Política en McGill University. Obtuvo su Doctorado
      en la Universidad de Washington en 2016. Sus amplios intereses de investigación abarcan diversas
      temáticas, tales como la democracia, la participación política, el efecto de la información, y el
      desarrollo y uso de métodos cuantitativos avanzados. Su investigación ha sido publicada en revistas
      como la American Political Science Review, Journal of Politics, Comparative Political Studies, y
      muchas otras.
    ru: Aaron Erlich — доцент кафедры политической науки в McGill University. Степень доктора философии
      (Ph.D.) он получил в Университете Вашингтона в 2016 году. Его широкий круг научных интересов охватывает
      такие темы, как демократия, политическое участие, эффект информации, а также разработка и применение
      передовых количественных методов. Его исследования опубликованы в таких журналах, как American Political
      Science Review, Journal of Politics, Comparative Political Studies и многих других.
    uk: Aaron Erlich — доцент кафедри політичної науки в McGill University. Він здобув ступінь доктора
      філософії (Ph.D.) в Університеті Вашингтона у 2016 році. Його різноманітні наукові інтереси охоплюють
      такі теми, як демократія, політична участь, вплив інформації, а також розробка та застосування сучасних
      кількісних методів. Його дослідження опубліковані в таких журналах, як American Political Science
      Review, Journal of Politics, Comparative Political Studies та багатьох інших.
    ka: Aaron Erlich არის McGill University-ის პოლიტიკის მეცნიერების ასოცირებული პროფესორი. მან დოქტორის
      ხარისხი მიიღო ვაშინგტონის უნივერსიტეტში 2016 წელს. მისი მრავალმხრივი სამეცნიერო ინტერესები მოიცავს
      სხვადასხვა თემას, როგორებიცაა დემოკრატია, პოლიტიკური მონაწილეობა, ინფორმაციის ეფექტი, და მოწინავე
      რაოდენობრივი მეთოდების შემუშავება და გამოყენება. მისი კვლევები გამოქვეყნებულია ისეთ ჟურნალებში,
      როგორებიცაა American Political Science Review, Journal of Politics, Comparative Political Studies
      და სხვა მრავალი.
    de: Aaron Erlich ist Professor für Politikwissenschaft an der McGill University.
      Er promovierte 2016 an der Universität Washington. Seine vielfältigen Forschungsinteressen berühren
      verschiedene Themen wie Demokratie, politische Partizipation, Informationseffekte sowie die Entwicklung
      und Anwendung fortgeschrittener quantitativer Methoden. Seine Forschungsergebnisse wurden in Fachzeitschriften
      wie dem American Political Science Review, dem Journal of Politics, Comparative Political Studies
      und vielen anderen veröffentlicht.
