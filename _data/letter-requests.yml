# _data/letter-requests.yml
#
# State store for in-flight letter of recommendation requests.
# Managed by scripts/cv_admin.py (the Flask admin app's Letters tab).
#
# Each entry tracks one student-letter-cycle from the moment Aaron
# generates their upload link through final "sent" status. Returning
# students reuse an existing folder but get a new entry per cycle
# (so the state_log stays per-request, not per-student).
#
# State machine:
#   pending_upload → uploaded → drafting → draft_ready → approved → sent → closed
#
# The Claude skill at ~/.claude/skills/letter-draft reads this file by
# token to get the letter_type for drafting.

requests: []
