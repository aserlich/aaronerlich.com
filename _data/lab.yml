pi:
  name: Aaron Erlich
  headshot: images/profile.jpg
  bio: is Associate Professor of Political Science at McGill University. He received his Ph.D. from the University of Washington
    in 2016. His wide-ranging research interests touch upon various themes such as democracy, political participation, the
    effect of information, and the development and use of advanced quantitative methods. His research has been published in
    journals such as the *American Political Science Review*, *Journal of Politics*, *Comparative Political Studies*, and
    many others.
current_grad:
- name: David Dubé
  headshot: images/headshot-dube.png
  degree: PhD candidate
  bio: is a PhD candidate in Political Science at McGill University, interested in the informal political economy of post-communist
    Europe and Eurasia and the relationship between (mis)information, beliefs, and political behaviour in democratic, hybrid
    and authoritarian regimes. As a graduate student, David developed a growing interest in using statistical methods for
    causal inference and machine learning (natural language processing & computer vision) for large datasets and complex data
    analysis.
- name: Katerina McMullen
  headshot: images/headshot-mcmullen.jpeg
  degree: MA student
  bio: is an M.A. student in Political Science at McGill University. Her research focuses on the socio-political analysis
    of large language models. Her thesis is assessing how LLMs handle and respond to queries about the US election when confronted
    with misleading or false information. She was awarded funding from the Social Science and Humanities Research Council
    (SSHRC) for that project.
- name: Aiden McIlvaney
  degree: MA student
  headshot: ''
  bio: ''
current_undergrad:
- name: Lawrence Plastina
  headshot: ''
  degree: Undergraduate (3rd year)
  bio: is a third-year undergraduate student double majoring in political science and statistics. He was one of 29 recipients
    of McGill's 2024 Arts Undergraduate Research Internship Award, using quantitative methods to study Ukrainian self-reported
    firearm ownership under Prof. Erlich's supervision.
