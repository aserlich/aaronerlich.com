- id: tool-citation-arcs
  kind: tool
  title: Citation Arcs
  url: https://aaronerlich.com/citation-arcs/
  blurb: 'Draw three views of any researcher''s citation record: cumulative in calendar time, aligned
    on publication, and the per-year arc. Runs entirely in your browser using OpenAlex.'
  year: '2026'
  venue: ''
  coauthors: []
  source:
    manual: true
  added: '2026-08-11'
  status: scheduled
  rounds:
  - n: 1
    opened: '2026-08-11'
    status: scheduled
    note: launch
    drafts:
      bluesky:
        text: 'A while back I posted my own citation record. This is the tool that drew it: put in
          your ORCID and it makes the same three charts for yours, including the arc showing when
          each paper actually peaked. Runs in your browser. https://aaronerlich.com/citation-arcs/'
        embed:
          uri: https://aaronerlich.com/citation-arcs/
          title: Citation Arcs
          description: 'Draw three views of any researcher''s citation record: cumulative in calendar
            time, aligned on publication, and the per-year arc. Runs entirely in your browser using
            OpenAlex.'
      linkedin:
        text: |-
          A while back I posted what my own citation record looks like once you take age out of it. Several people asked whether they could run the same thing on themselves. You can.

          Put in your ORCID (or search your name) and it draws three views of your record: the cumulative curves, the same curves realigned so every paper starts at its own year zero, and a per-year arc showing when each paper actually peaked — something a cumulative curve can never show you, because it can only go up.

          Two things it does that most citation graphics hide. Citations before publication are real and drawn as such: a working paper does work long before it appears in an issue. And the incomplete current year is dashed, because drawing it solid makes every curve appear to flatten at the same moment, which looks like a finding and is an artifact.

          It runs entirely in your browser. Your identifier goes to OpenAlex and nowhere else — there is no server of mine involved and nothing is logged. Numbers will look lower than Google Scholar, which indexes preprints and chapters OpenAlex does not; the ranking is nearly identical, and these charts are about shape rather than level.

          Venue tiering is the shakiest part and I would genuinely like bug reports. Code, and an R package that does more than the widget: github.com/aserlich/scholar-arcs

          https://aaronerlich.com/citation-arcs/
    post_at: '2026-08-19T09:30:00-04:00'
- id: post-2026-08-citation-arcs
  kind: blog
  title: Did it matter where the paper landed?
  url: https://aaronerlich.com/posts/2026-08-citation-arcs/
  blurb: I pulled citation histories for all 30 of my published papers and colour-coded them by journal
    type. Top-3 journals raise the floor, not the ceiling — and the most-cited paper in my record
    is the one that got lucky.
  year: '2026'
  venue: ''
  coauthors: []
  source:
    path: posts/2026-08-citation-arcs/index.qmd
  added: '2026-08-11'
  status: posted
  rounds:
  - n: 1
    opened: '2026-08-11'
    status: posted
    note: launch
    drafts:
      bluesky:
        text: All 30 of my published papers, grouped by where they landed. The top 3 don't raise
          the ceiling — they raise the floor. My fastest-climbing paper is in a subfield journal;
          it came out three months before the invasion. https://aaronerlich.com/posts/2026-08-citation-arcs/
        embed:
          uri: https://aaronerlich.com/posts/2026-08-citation-arcs/
          title: Did it matter where the paper landed?
          description: I pulled citation histories for all 30 of my published papers and colour-coded
            them by journal type. Top-3 journals raise the floor, not the ceiling — and the most-cited
            paper in my record is the one that got lucky.
      linkedin:
        text: "Does it matter where a paper lands, a colleague asked about my last post. While I\
          \ can't causally answer that question, I pulled citation histories for all 30 of my published\
          \ papers and colour-coded them by the kind of journal that took them.\n\nThe pattern that\
          \ survives: the top 3 don't raise the ceiling. They raise the floor. At three years post-publication\
          \ my AJPS/APSR/JOP papers sit at 18, 26 and 55 citations — while my subfield-journal papers\
          \ at the same age run from 1 all the way to 104. Publishing in the top 3 doesn't look like\
          \ it gets you cited more. It looks more like protection from being ignored.\n\nThe most\
          \ unuusual paper in my record makes the point. \"Is pro-Kremlin Disinformation Effective?\"\
          \ came out in a subfield journal in November 2021, three months before the full-scale invasion.\
          \ It went 1 → 10 → 44 → 49 citations a year and is now my second-most-cited paper. It has\
          \ already turned; year four is down to 39 and falling. My APSR paper peaked around year\
          \ six and was still pulling 14 a decade out. I would rather have the second — but I chose\
          \ neither.\n\nTwo other things I learned: The fact that one paper carries a quarter of\
          \ my citations turns out to be unremarkable: the peer median of 10 of my peers is 23%.\
          \ And a comparison I liked, showing my median paper looking thin against peers, was mostly\
          \ measuring how differently people curate their Google Scholar profiles. \n\nYou can see\
          \ all the nice graphs here:\n\nhttps://aaronerlich.com/posts/2026-08-citation-arcs/"
