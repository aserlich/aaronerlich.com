- id: pub-erlichCoverageCandour2026
  kind: publication
  title: Coverage or Candour? Survey-Mode Trade-offs for Studying Wartime Ukraine
  url: https://discuss-data.net/cs/eescca/section/blog/coverage-or-candour/
  blurb: ''
  year: '2026'
  venue: Discuss Data
  coauthors: []
  source:
    citekey: erlichCoverageCandour2026
    section: blog
  added: '2026-08-11'
  status: posted
  rounds:
  - n: 1
    opened: '2026-08-11'
    status: posted
    note: launch
    drafts:
      bluesky:
        text: 'Phone or web panel in wartime Ukraine? Phone reaches the third of the country a panel
          cannot: rural, over 55. But phone respondents overstated volunteering by ~16%. You pick
          which error you can live with. https://discuss-data.net/cs/eescca/section/blog/coverage-or-candour/'
        embed:
          uri: https://discuss-data.net/cs/eescca/section/blog/coverage-or-candour/
          title: Coverage or Candour? Survey-Mode Trade-offs for Studying Wartime Ukraine
          description: Discuss Data
      linkedin:
        text: |-
          If you run surveys in wartime Ukraine, the mode you choose decides which error you get. I wrote up the trade-off for Discuss Data's new blog.

          Two surveys, fielded simultaneously between 25 July and 1 August 2022: a random-digit-dial telephone survey (n=1,206) and an opt-in web panel (n=1,192).

          The web panel is cheaper and faster, and it misses roughly a third of the country — rural residents and anyone over 55 were simply not reachable on it (this changes all the time, so the situation may be different now). That is not a rounding error, it is a structural hole, and it shows up in the results: the telephone sample recorded 14% displaced respondents against the panel's 21%, along with more Soviet-era veterans and higher concern about the draft.

          The telephone survey has the opposite problem. Talking to a person invites you to perform civic virtue. Under an honesty frame, telephone respondents overstated their volunteering by about 16%. The web respondents showed no such inflation.

          So neither is the correct mode. The useful question is which kind of error your particular question can tolerate — and the answer differs for "how many people were displaced" and "how many people volunteered". Where the budget allows, mixed-mode designs let each mode cover for the other. Where it does not, ask your provider directly which demographics they cannot reach, and report the limits to your readers and your funders rather than hiding it.

          The post: https://discuss-data.net/cs/eescca/section/blog/coverage-or-candour/

          It draws on my article in Post-Soviet Affairs, "Two implications of survey research mode during war": https://doi.org/10.1080/1060586X.2025.2529114

          Discuss Data (@[Discuss Data]) has just launched this blog for research on Eastern Europe, the South Caucasus and Central Asia — worth following if that is your region: https://discuss-data.net/cs/eescca/section/blog/
    post_at: '2026-08-14T09:30:00-04:00'
